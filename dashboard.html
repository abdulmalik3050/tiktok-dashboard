<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم التفصيلية</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-main: #F4F6FB;
    --bg-card: #FFFFFF;
    --accent: #3D5A80;
    --accent2: #5B8F7F;
    --accent3: #D9A066;
    --text: #1E293B;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    direction: rtl;
    min-height: 100vh;
  }
  header {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  .btn { background: var(--accent); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 10px; font-size: 0.85rem; border: none; cursor: pointer; font-family: inherit; }
  .container { padding: 24px; max-width: 1200px; margin: 0 auto; }

  .picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  select {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); font-family: inherit;
    font-size: 0.9rem; background: #fff; min-width: 220px;
  }
  .status-pill { font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; }
  .status-ok { background: #ECFDF5; color: #065F46; }
  .status-warn { background: #FFFBEB; color: #92400E; }

  .kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 18px 24px; flex: 1; min-width: 140px; text-align: center; }
  .kpi-value { display: block; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .kpi-label { font-size: 0.85rem; color: var(--text-muted); }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
  .card { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 12px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chart-head h2 { margin-bottom: 0; }
  .legend-row { display: flex; gap: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted); }
  .legend-item i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .donut-layout { display: flex; align-items: center; gap: 18px; }
  .donut-layout canvas { max-width: 230px; max-height: 230px; flex-shrink: 0; }
  .donut-legend { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .donut-legend li { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .donut-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend .legend-label { color: var(--text); flex: 1; }
  .donut-legend .legend-pct { color: var(--text-muted); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); }
</style>
</head>
<body>

<header>
  <h1>📈 لوحة التحكم التفصيلية</h1>
  <a class="btn" href="/accounts.html">← الحسابات المتصلة</a>
</header>

<div class="container">
  <div class="picker-row">
    <select id="accountPicker"></select>
    <span id="statusPill"></span>
  </div>
  <div id="content"><div class="loading">جاري التحميل…</div></div>
</div>

<script>
let allAccounts = [];
let viewsChart = null;
let engagementChart = null;

async function init() {
  const meRes = await fetch('/.netlify/functions/auth-me', { credentials: 'same-origin' });
  const me = await meRes.json();
  if (!me.authenticated) { window.location.href = '/login.html'; return; }

  const res = await fetch('/.netlify/functions/list-accounts', { cache: 'no-store', credentials: 'same-origin' });
  if (res.status === 401) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  allAccounts = data.accounts || [];

  if (allAccounts.length === 0) {
    document.querySelector('.picker-row').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="card empty-state">
        <div class="empty-icon">📊</div>
        <h2>ما فيه حسابات مربوطة بعد</h2>
        <p style="margin-top:8px;"><a href="/connect-tiktok.html" style="color:var(--accent);font-weight:600;">اربط أول حساب ←</a></p>
      </div>`;
    return;
  }

  const picker = document.getElementById('accountPicker');
  picker.innerHTML = allAccounts.map((a) => `<option value="${escapeHtml(a.open_id)}">${escapeHtml(a.display_name)}</option>`).join('');

  const params = new URLSearchParams(window.location.search);
  const requested = params.get('open_id');
  if (requested && allAccounts.some((a) => a.open_id === requested)) {
    picker.value = requested;
  }

  picker.addEventListener('change', () => render(picker.value));
  render(picker.value);
}

function render(openId) {
  const acc = allAccounts.find((a) => a.open_id === openId);
  if (!acc) return;

  const pill = document.getElementById('statusPill');
  const needsReconnect = acc.sync_status === 'needs_reconnect';
  pill.innerHTML = needsReconnect
    ? '<span class="status-pill status-warn">⚠️ يحتاج إعادة ربط</span>'
    : '<span class="status-pill status-ok">✓ متصل</span>';

  const videos = acc.videos || [];
  const hasVideos = videos.length > 0;

  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span class="kpi-value">${fmt(acc.follower_count)}</span><span class="kpi-label">متابعين</span></div>
      <div class="kpi"><span class="kpi-value">${fmt(videos.length)}</span><span class="kpi-label">فيديوهات</span></div>
      <div class="kpi"><span class="kpi-value">${fmt(acc.likes_count)}</span><span class="kpi-label">إجمالي الإعجابات</span></div>
    </div>
    ${
      hasVideos
        ? `
    <div class="charts">
      <div class="card">
        <div class="chart-head">
          <h2>المشاهدات والإعجابات لكل فيديو</h2>
          <div class="legend-row">
            <span class="legend-item"><i style="background:#3D5A80"></i>مشاهدات</span>
            <span class="legend-item"><i style="background:#5B8F7F"></i>إعجابات</span>
          </div>
        </div>
        <canvas id="viewsChart" height="230"></canvas>
      </div>
      <div class="card">
        <h2>توزيع التفاعل</h2>
        <div class="donut-layout">
          <canvas id="engagementChart"></canvas>
          <ul class="donut-legend" id="engagementLegend"></ul>
        </div>
      </div>
    </div>
     
    </div>`
        : `
    <div class="card empty-state">
      <div class="empty-icon">📊</div>
      <h2>لسه ما فيه فيديوهات لعرضها</h2>
      <p>بمجرد ما ينشر هذا الحساب فيديوهات، بتظهر هنا رسومات تلقائيًا.</p>
    </div>`
    }
  `;

  if (hasVideos) drawCharts(videos);
}

function drawCharts(videos) {
  if (viewsChart) viewsChart.destroy();
  if (engagementChart) engagementChart.destroy();

  const labels = videos.map((v, i) => `فيديو ${i + 1}`);
  const views = videos.map((v) => v.view_count || 0);
  const likes = videos.map((v) => v.like_count || 0);
  const totalLikes = sum(videos, 'like_count');
  const totalComments = sum(videos, 'comment_count');
  const totalShares = sum(videos, 'share_count');

  Chart.defaults.font.family = "'Segoe UI', Tahoma, Arial, sans-serif";
  Chart.defaults.color = '#64748B';

  viewsChart = new Chart(document.getElementById('viewsChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'مشاهدات', data: views, backgroundColor: '#3D5A80', borderRadius: 4, maxBarThickness: 34, yAxisID: 'yViews' },
        { label: 'إعجابات', data: likes, backgroundColor: '#5B8F7F', borderRadius: 4, maxBarThickness: 34, yAxisID: 'yLikes' },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#64748B', font: { size: 11 } } },
        yViews: {
          type: 'linear', position: 'right',
          grid: { color: '#EEF1F6' }, border: { display: false },
          ticks: { color: '#3D5A80' },
          title: { display: true, text: 'مشاهدات', color: '#3D5A80', font: { size: 11 } },
        },
        yLikes: {
          type: 'linear', position: 'left',
          grid: { display: false }, border: { display: false },
          ticks: { color: '#5B8F7F' },
          title: { display: true, text: 'إعجابات', color: '#5B8F7F', font: { size: 11 } },
        },
      },
    },
  });

  const engagementLabels = ['إعجابات', 'تعليقات', 'مشاركات'];
  const engagementTotals = [totalLikes, totalComments, totalShares];
  const engagementColors = ['#3D5A80', '#5B8F7F', '#D9A066'];
  const engagementTotal = engagementTotals.reduce((a, b) => a + b, 0) || 1;

  engagementChart = new Chart(document.getElementById('engagementChart'), {
    type: 'doughnut',
    data: { labels: engagementLabels, datasets: [{ data: engagementTotals, backgroundColor: engagementColors, borderWidth: 0 }] },
    options: { responsive: true, cutout: '62%', plugins: { legend: { display: false } } },
  });

  const legendEl = document.getElementById('engagementLegend');
  legendEl.innerHTML = '';
  engagementLabels.forEach((label, i) => {
    const pct = ((engagementTotals[i] / engagementTotal) * 100).toFixed(1);
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="background:${engagementColors[i]}"></span><span class="legend-label">${label}</span><span class="legend-pct">${pct}%</span>`;
    legendEl.appendChild(li);
  });
}

function sum(arr, key) { return arr.reduce((s, a) => s + (a[key] || 0), 0); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(str) { return String(str).replace(/[^a-zA-Z0-9_-]/g, '_'); }

init();
</script>

</body>
</html>
