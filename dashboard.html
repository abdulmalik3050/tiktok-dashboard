<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم التفصيلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    /* هوية ZANJBIIL: كحلي أساسي (~60%)، برتقالي للعناصر التفاعلية (~25%)،
       بنفسجي فاتح للتفاصيل الثانوية (~10-15%). الألوان الدلالية
       (أخضر/أحمر لزيادة/نقصان النسب) بقيت كما هي بدون تغيير. */
    --bg-main: #F5F5FB;
    --bg-card: #FFFFFF;
    --accent: #FF5100;
    --accent2: #6877B1;
    --accent3: #AEB6D8;
    --text: #1B1C4A;
    --text-muted: #5B5E85;
    --border: #DFE1F0;
    --card-shadow: 0 1px 3px rgba(27,28,74,0.05), 0 4px 14px rgba(27,28,74,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    direction: rtl;
    min-height: 100vh;
  }
  header {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-title-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-logo { height: 30px; width: auto; display: block; }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn { background: var(--accent); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 10px; font-size: 0.85rem; border: none; cursor: pointer; font-family: inherit; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .container { padding: 24px; max-width: 1200px; margin: 0 auto; }
 
  .picker-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  select, input[type="date"], input[type="text"] {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); font-family: inherit;
    font-size: 0.9rem; background: #fff;
  }
  select { min-width: 220px; }
  .status-pill { font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; }
  .status-ok { background: #ECFDF5; color: #065F46; }
  .status-warn { background: #FFFBEB; color: #92400E; }
 
  .kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 18px 24px; flex: 1; min-width: 140px; text-align: center; }
  .kpi-value { display: block; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .kpi-label { font-size: 0.85rem; color: var(--text-muted); }
 
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
  .card { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 12px; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chart-head h2 { margin-bottom: 0; }
  .legend-row { display: flex; gap: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted); }
  .legend-item i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .donut-layout { display: flex; align-items: center; gap: 18px; }
  .donut-layout canvas { max-width: 230px; max-height: 230px; flex-shrink: 0; }
  .donut-legend { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .donut-legend li { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .donut-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend .legend-label { color: var(--text); flex: 1; }
  .donut-legend .legend-pct { color: var(--text-muted); font-weight: 600; }
 
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); }
 
  /* ===== Campaign comparison ===== */
  .campaign-form { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.8rem; color: var(--text-muted); }
  .campaign-active { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .campaign-badge { background: #FFEDE3; color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .compare-cell { background: var(--bg-main); border-radius: 12px; padding: 14px 16px; text-align: center; }
  .compare-cell .metric-name { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
  .compare-cell .metric-values { display: flex; justify-content: center; align-items: baseline; gap: 6px; font-size: 1.05rem; font-weight: 700; }
  .compare-cell .arrow { font-size: 0.85rem; }
  .change-up { color: #16A34A; }
  .change-down { color: #DC2626; }
  .change-flat { color: var(--text-muted); }
  .compare-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; }
  .link-btn { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 0.85rem; cursor: pointer; text-decoration: underline; padding: 0; }

  .compare-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .compare-tab { background: none; border: none; font-family: inherit; font-size: 0.88rem; padding: 10px 6px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .compare-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .compare-tab:hover:not(.active) { color: var(--text); }

  .total-views-hero { background: linear-gradient(135deg, #EEF0FA, #FAFAFD); border: 1px solid var(--border); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
  .total-views-hero .hero-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
  .total-views-hero .hero-values { display: flex; justify-content: center; align-items: baseline; gap: 10px; font-size: 2.1rem; font-weight: 800; color: var(--accent); }
  .total-views-hero .hero-arrow { font-size: 1rem; font-weight: 700; margin-top: 6px; }
  @media (max-width: 480px) { .total-views-hero .hero-values { font-size: 1.5rem; } }

  /* ===== Three-point (before / reference video / after) comparison ===== */
  .tp-row { display: flex; justify-content: center; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tp-value { color: var(--text); }
  .tp-value.tp-ref { color: var(--accent); font-weight: 900; font-size: 1.35em; }
  .tp-value.tp-missing { color: var(--text-muted); font-weight: 400; }
  .tp-arrow { color: var(--text-muted); font-weight: 400; }
  .tp-caption-row { display: flex; justify-content: center; align-items: flex-start; gap: 10px; margin-top: 8px; font-size: 0.74rem; color: var(--text-muted); }
  .tp-caption-row span { flex: 1; min-width: 60px; text-align: center; }
  .tp-caption-row .tp-ref-caption { color: var(--accent); font-weight: 700; }
  .total-views-hero .tp-row.hero-values { font-size: 1.7rem; }
  .total-views-hero .tp-row.hero-values .tp-value.tp-ref { font-size: 1.3em; }
  @media (max-width: 480px) { .total-views-hero .tp-row.hero-values { font-size: 1.25rem; } }
  .compare-cell .tp-row { font-size: 1.05rem; font-weight: 700; margin-top: 4px; }

  /* ===== Color customization panel ===== */
  .color-panel {
    position: fixed; top: 0; left: 0; height: 100vh; width: 280px; background: #fff;
    box-shadow: 4px 0 24px rgba(0,0,0,0.12); padding: 22px; z-index: 200;
    transform: translateX(-100%); transition: transform .25s ease;
    overflow-y: auto;
  }
  .color-panel.open { transform: translateX(0); }
  .color-panel h3 { font-size: 1rem; margin-bottom: 16px; }
  .color-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .color-row label { font-size: 0.85rem; }
  .color-row input[type="color"] { width: 42px; height: 32px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; cursor: pointer; }
  .color-panel-actions { display: flex; gap: 8px; margin-top: 20px; }
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.35); z-index: 190; display: none; }
  .overlay.open { display: block; }
</style>
</head>
<body>
 
<header>
  <div class="header-title-group">
    <img class="brand-logo" src="zanjbiil-logo.png" alt="ZANJBIIL" onerror="this.style.display='none'">
    <h1>📈 لوحة التحكم التفصيلية</h1>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="openColorsBtn">🎨 تخصيص الألوان</button>
    <a class="btn" href="/accounts.html">← الحسابات المتصلة</a>
  </div>
</header>
 
<div class="overlay" id="overlay"></div>
<div class="color-panel" id="colorPanel">
  <h3>ألوان الرسومات البيانية</h3>
  <div class="color-row"><label>لون المشاهدات</label><input type="color" id="colorViews"></div>
  <div class="color-row"><label>لون الإعجابات</label><input type="color" id="colorLikes"></div>
  <div class="color-row"><label>لون المشاركات</label><input type="color" id="colorShares"></div>
  <div class="color-panel-actions">
    <button class="btn" id="applyColorsBtn" style="flex:1;">تطبيق</button>
    <button class="btn btn-ghost" id="resetColorsBtn">افتراضي</button>
  </div>
</div>
 
<div class="container">
  <div class="picker-row">
    <select id="accountPicker"></select>
    <span id="statusPill"></span>
  </div>
  <div id="content"><div class="loading">جاري التحميل…</div></div>
</div>
 
<script>
let allAccounts = [];
let viewsChart = null;
let engagementChart = null;
let currentOpenId = null;
 
const DEFAULT_COLORS = { views: '#FF5100', likes: '#6877B1', shares: '#AEB6D8' };
 
function loadColors() {
  try {
    const saved = JSON.parse(localStorage.getItem('dashboardChartColors') || 'null');
    return saved ? { ...DEFAULT_COLORS, ...saved } : { ...DEFAULT_COLORS };
  } catch (e) {
    return { ...DEFAULT_COLORS };
  }
}
function saveColors(colors) {
  localStorage.setItem('dashboardChartColors', JSON.stringify(colors));
}
 
async function init() {
  const meRes = await fetch('/.netlify/functions/auth-me', { credentials: 'same-origin' });
  const me = await meRes.json();
  if (!me.authenticated) { window.location.href = '/login.html'; return; }
 
  const res = await fetch('/.netlify/functions/list-accounts', { cache: 'no-store', credentials: 'same-origin' });
  if (res.status === 401) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  allAccounts = data.accounts || [];
 
  if (allAccounts.length === 0) {
    document.querySelector('.picker-row').style.display = 'none';
    document.getElementById('content').innerHTML = `
      <div class="card empty-state">
        <div class="empty-icon">📊</div>
        <h2>ما فيه حسابات مربوطة بعد</h2>
        <p style="margin-top:8px;"><a href="/connect-tiktok.html" style="color:var(--accent);font-weight:600;">اربط أول حساب ←</a></p>
      </div>`;
    return;
  }
 
  const picker = document.getElementById('accountPicker');
  picker.innerHTML = allAccounts.map((a) => `<option value="${escapeHtml(a.open_id)}">${escapeHtml(a.display_name)}</option>`).join('');
 
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('open_id');
  if (requested && allAccounts.some((a) => a.open_id === requested)) {
    picker.value = requested;
  }
 
  picker.addEventListener('change', () => render(picker.value));
  render(picker.value);
 
  initColorPanel();
}
 
function render(openId) {
  const acc = allAccounts.find((a) => a.open_id === openId);
  if (!acc) return;
  if (currentOpenId !== openId) refVideoId = null;
  currentOpenId = openId;
 
  const pill = document.getElementById('statusPill');
  const needsReconnect = acc.sync_status === 'needs_reconnect';
  pill.innerHTML = needsReconnect
    ? '<span class="status-pill status-warn">⚠️ يحتاج إعادة ربط</span>'
    : '<span class="status-pill status-ok">✓ متصل</span>';
 
  const videos = acc.videos || [];
  const hasVideos = videos.length > 0;
 
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span class="kpi-value">${fmt(acc.follower_count)}</span><span class="kpi-label">متابعين</span></div>
      <div class="kpi"><span class="kpi-value">${fmt(videos.length)}</span><span class="kpi-label">فيديوهات</span></div>
      <div class="kpi"><span class="kpi-value">${fmt(acc.likes_count)}</span><span class="kpi-label">إجمالي الإعجابات</span></div>
    </div>
    ${
      hasVideos
        ? `
    <div class="charts">
      <div class="card">
        <div class="chart-head">
          <h2>المشاهدات والإعجابات لكل فيديو</h2>
          <div class="legend-row" id="viewsLegend"></div>
        </div>
        <canvas id="viewsChart" height="230"></canvas>
      </div>
      <div class="card">
        <h2>توزيع التفاعل</h2>
        <div class="donut-layout">
          <canvas id="engagementChart"></canvas>
          <ul class="donut-legend" id="engagementLegend"></ul>
        </div>
      </div>
    </div>`
        : `
    <div class="card empty-state">
      <div class="empty-icon">📊</div>
      <h2>لسه ما فيه فيديوهات لعرضها</h2>
      <p>بمجرد ما ينشر هذا الحساب فيديوهات، بتظهر هنا رسومات تلقائيًا.</p>
    </div>`
    }
    <div class="card" id="campaignCard"></div>
  `;
 
  if (hasVideos) drawCharts(videos);
  renderCampaignCard(acc);
}
 
/* ========== PERFORMANCE COMPARISON (before/after) ========== */

let campaignSelectionMode = 'date'; // 'date' | 'video'
let refVideoId = null;
let refCompareBasis = 'video'; // 'video' | 'day'

// يبني قائمة الفيديوهات الصالحة للترتيب الزمني من acc.videos الخام،
// ويستبعد أي فيديو بدون تاريخ نشر صالح (create_time مفقود أو لا يتحول
// لتاريخ صحيح) أو مكرر بنفس معرف الفيديو (id) — لأن أي فيديو ناقص أو
// مكرر بالمصفوفة يزيح موقع الفهرسة (index) لكل الفيديوهات اللي بعده،
// فيخلي حساب "قبل/بعد" يتخطى الفيديو الصحيح بدون أي خطأ ظاهر بالكود.
function getValidVideosForComparison(acc) {
  const rawVideos = acc.videos || [];
  const seenIds = new Set();
  const videos = [];
  const excludedVideos = [];

  rawVideos.forEach((v) => {
    const t = v.create_time ? new Date(v.create_time).getTime() : NaN;
    const isDuplicate = v.id && seenIds.has(v.id);
    if (!v.create_time || isNaN(t) || isDuplicate) {
      excludedVideos.push(v);
      return;
    }
    if (v.id) seenIds.add(v.id);
    videos.push(v);
  });

  return { videos, excludedVideos };
}

function renderCampaignCard(acc) {
  const el = document.getElementById('campaignCard');
  const { videos, excludedVideos } = getValidVideosForComparison(acc);

  el.innerHTML = `
    <div class="compare-tabs">
      <button class="compare-tab ${campaignSelectionMode === 'date' ? 'active' : ''}" data-mode="date">📅 تاريخ يدوي</button>
      <button class="compare-tab ${campaignSelectionMode === 'video' ? 'active' : ''}" data-mode="video">🎬 فيديو مرجعي</button>
    </div>
    <div id="compareBody"></div>
  `;

  el.querySelectorAll('.compare-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (campaignSelectionMode === btn.dataset.mode) return;
      campaignSelectionMode = btn.dataset.mode;
      renderCampaignCard(acc);
    });
  });

  if (campaignSelectionMode === 'date') {
    renderDateCampaignBody(acc, videos);
  } else {
    renderVideoCampaignBody(acc, videos, excludedVideos);
  }
}

function renderDateCampaignBody(acc, videos) {
  const body = document.getElementById('compareBody');
  if (acc.campaign && acc.campaign.date) {
    body.innerHTML = renderCampaignComparison(acc, videos);
    document.getElementById('editCampaignBtn')?.addEventListener('click', () => {
      body.innerHTML = renderCampaignForm(acc);
      bindCampaignFormEvents(acc);
    });
  } else {
    body.innerHTML = renderCampaignForm(acc);
    bindCampaignFormEvents(acc);
  }
}
 
function renderCampaignForm(acc) {
  const existingDate = acc.campaign && acc.campaign.date ? acc.campaign.date.slice(0, 10) : '';
  const existingLabel = acc.campaign && acc.campaign.label ? acc.campaign.label : '';
  return `
    <h2>📌 مقارنة الأداء قبل/بعد إعلان أو تعاون</h2>
    <p class="compare-note" style="margin-bottom:14px;">حدد تاريخ الإعلان أو التعاون مع المؤثر، ونقارن لك متوسط أداء الفيديوهات قبله وبعده تلقائيًا.</p>
    <div class="campaign-form">
      <div class="field">
        <label>تاريخ الإعلان</label>
        <input type="date" id="campaignDateInput" value="${escapeAttr(existingDate)}">
      </div>
      <div class="field" style="flex:1; min-width:180px;">
        <label>وصف مختصر (اختياري)</label>
        <input type="text" id="campaignLabelInput" placeholder="مثال: تعاون مع فلان" value="${escapeHtml(existingLabel)}" maxlength="100" style="width:100%;">
      </div>
      <button class="btn" id="saveCampaignBtn">حفظ</button>
    </div>
    <div id="campaignFormMsg" style="margin-top:10px; font-size:0.85rem;"></div>
  `;
}
 
function bindCampaignFormEvents(acc) {
  document.getElementById('saveCampaignBtn').addEventListener('click', async () => {
    const dateVal = document.getElementById('campaignDateInput').value;
    const labelVal = document.getElementById('campaignLabelInput').value;
    const msgEl = document.getElementById('campaignFormMsg');
 
    if (!dateVal) {
      msgEl.style.color = '#DC2626';
      msgEl.textContent = 'اختر تاريخ أول.';
      return;
    }
 
    msgEl.style.color = 'var(--text-muted)';
    msgEl.textContent = 'جاري الحفظ…';
 
    try {
      const res = await fetch('/.netlify/functions/set-campaign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ open_id: acc.open_id, campaign_date: dateVal, campaign_label: labelVal }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'تعذر الحفظ');
 
      acc.campaign = data.campaign;
      renderCampaignCard(acc);
    } catch (err) {
      msgEl.style.color = '#DC2626';
      msgEl.textContent = err.message || 'حدث خطأ، حاول مرة ثانية.';
    }
  });
}
 
function renderCampaignComparison(acc, videos) {
  const campaignDate = new Date(acc.campaign.date);
  const before = videos.filter((v) => new Date(v.create_time) < campaignDate);
  const after = videos.filter((v) => new Date(v.create_time) >= campaignDate);

  const label = acc.campaign.label ? `${escapeHtml(acc.campaign.label)} — ` : '';
  const dateStr = campaignDate.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });

  return `
    <div class="campaign-active">
      <div>
        <h2 style="margin-bottom:6px;">📌 مقارنة الأداء: قبل/بعد</h2>
        <span class="campaign-badge">${label}${dateStr}</span>
      </div>
      <button class="link-btn" id="editCampaignBtn">تعديل التاريخ</button>
    </div>
    ${buildComparisonHTML(before, after, {
      emptyNote: `نحتاج فيديوهات قبل وبعد هذا التاريخ عشان نقدر نقارن (حاليًا: ${before.length} قبل، ${after.length} بعد).`,
      note: `مقارنة بين ${before.length} فيديو قبل التاريخ، و ${after.length} فيديو بعده.`,
    })}
  `;
}

/* ========== REFERENCE-VIDEO BASED COMPARISON ========== */

// تنبيه واضح للمستخدم بأي فيديوهات استُبعدت من ترتيب "قبل/بعد" (تاريخ
// نشر مفقود/غير صالح، أو معرف فيديو مكرر) — عشان لو فيديو متوقّع يظهر
// كـ"قبل" أو "بعد" ما ظهر، يعرف السبب بدل ما يبدو كخطأ بالحساب.
function excludedVideosWarningHTML(excludedVideos) {
  if (!excludedVideos || excludedVideos.length === 0) return '';
  const items = excludedVideos.map((v) => {
    const title = (v.title || '').trim() || 'فيديو بدون عنوان';
    const reason = !v.create_time ? 'تاريخ نشر غير متوفر' : 'تاريخ نشر غير صالح أو معرف مكرر';
    return `<li>${escapeHtml(title)} — ${reason}</li>`;
  }).join('');
  return `
    <div class="compare-note" style="background:#FFFBEB; color:#92400E; border-radius:10px; padding:10px 14px; margin-bottom:14px;">
      ⚠️ ${excludedVideos.length} فيديو ما دخل بحساب "قبل/بعد" لعدم توفر تاريخ نشر صالح:
      <ul style="margin:6px 0 0 0; padding-inline-start:18px;">${items}</ul>
    </div>
  `;
}

function renderVideoCampaignBody(acc, videos, excludedVideos) {
  const body = document.getElementById('compareBody');
  excludedVideos = excludedVideos || [];

  if (videos.length < 2) {
    body.innerHTML = `
      <h2>🎬 مقارنة بفيديو مرجعي (إعلان / تعاون)</h2>
      <p class="compare-note" style="margin-top:10px;">نحتاج فيديوهين على الأقل بهذا الحساب عشان نقدر نستخدم هذي الطريقة.</p>
      ${excludedVideosWarningHTML(excludedVideos)}
    `;
    return;
  }

  const sorted = [...videos].sort((a, b) => new Date(a.create_time) - new Date(b.create_time));
  const options = sorted.slice().reverse().map((v) => {
    const title = (v.title || '').trim();
    const label = title || `فيديو بدون عنوان (${new Date(v.create_time).toLocaleDateString('ar-SA')})`;
    return `<option value="${escapeAttr(v.id)}" ${v.id === refVideoId ? 'selected' : ''}>${escapeHtml(label)}</option>`;
  }).join('');

  body.innerHTML = `
    <h2>🎬 مقارنة بفيديو مرجعي (إعلان / تعاون)</h2>
    <p class="compare-note" style="margin-bottom:14px;">اختر فيديو الإعلان أو التعاون مع المؤثر، ثم اختر طريقة المقارنة.</p>
    ${excludedVideosWarningHTML(excludedVideos)}
    <div class="campaign-form" style="margin-bottom:14px;">
      <div class="field" style="flex:1; min-width:220px;">
        <label>الفيديو المرجعي</label>
        <select id="refVideoSelect">
          <option value="">— اختر فيديو —</option>
          ${options}
        </select>
      </div>
    </div>
    <div id="refCompareModeRow"></div>
    <div id="refCompareResult"></div>
  `;

  document.getElementById('refVideoSelect').addEventListener('change', (e) => {
    refVideoId = e.target.value || null;
    renderRefCompareModeAndResult(sorted);
  });

  renderRefCompareModeAndResult(sorted);
}

function renderRefCompareModeAndResult(sorted) {
  const modeRow = document.getElementById('refCompareModeRow');
  const resultEl = document.getElementById('refCompareResult');

  if (!refVideoId) {
    modeRow.innerHTML = '';
    resultEl.innerHTML = '';
    return;
  }

  const refIndex = sorted.findIndex((v) => v.id === refVideoId);
  const refVideo = refIndex >= 0 ? sorted[refIndex] : null;
  if (!refVideo) {
    modeRow.innerHTML = '';
    resultEl.innerHTML = '';
    return;
  }

  modeRow.innerHTML = `
    <div class="compare-tabs" style="margin-bottom:14px;">
      <button class="compare-tab ${refCompareBasis === 'video' ? 'active' : ''}" data-basis="video">🎬 مقارنة بالفيديو</button>
      <button class="compare-tab ${refCompareBasis === 'day' ? 'active' : ''}" data-basis="day">📆 مقارنة باليوم</button>
    </div>
  `;
  modeRow.querySelectorAll('.compare-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (refCompareBasis === btn.dataset.basis) return;
      refCompareBasis = btn.dataset.basis;
      renderRefCompareModeAndResult(sorted);
    });
  });

  const refTitle = (refVideo.title || '').trim() || 'الفيديو المختار';

  if (refCompareBasis === 'video') {
    // ترتيب زمني تصاعدي، وموقع الفيديو المرجعي (refIndex) بهذا الترتيب:
    // "قبل" = الفيديو اللي قبله مباشرة (index - 1)، "بعد" = الفيديو اللي
    // يليه مباشرة (index + 1) — بدون أي حساب فروقات وقت. فيديو مقابل
    // فيديو مقابل فيديو → عرض ثلاث نقاط (قبل ← المرجعي ← بعد) بدل بطاقتين.
    const prevVideo = refIndex > 0 ? sorted[refIndex - 1] : null;
    const nextVideo = refIndex < sorted.length - 1 ? sorted[refIndex + 1] : null;
    resultEl.innerHTML = buildThreePointHTML(prevVideo, refVideo, nextVideo, refTitle);
    return;
  }

  // 'day': عدة فيديوهات باليوم قبل/بعد ← إجمالي (مجموع) لكل فترة، بنفس
  // تنسيق بطاقتي "قبل/بعد" الأصلي (سهم ▲/▼ ونسبة %).
  const refTime = new Date(refVideo.create_time).getTime();
  const oneDay = 24 * 60 * 60 * 1000;
  const before = sorted.filter((v) => v.id !== refVideo.id && new Date(v.create_time).getTime() >= refTime - oneDay && new Date(v.create_time).getTime() < refTime);
  const after = sorted.filter((v) => v.id !== refVideo.id && new Date(v.create_time).getTime() > refTime && new Date(v.create_time).getTime() <= refTime + oneDay);
  const note = `مقارنة بين فيديوهات يوم قبل نشر «${escapeHtml(refTitle)}»، وفيديوهات يوم بعده.`;
  const emptyNote = `ما فيه فيديوهات كافية بيوم قبل أو بعد هذا الفيديو (حاليًا: ${before.length} قبل، ${after.length} بعد).`;
  resultEl.innerHTML = buildComparisonHTML(before, after, { note, emptyNote, secondaryMode: 'total' });
}

// عرض "ثلاث نقاط" لوضع "مقارنة بالفيديو": الفيديو اللي قبل الفيديو
// المرجعي مباشرة ← الفيديو المرجعي نفسه (مميّز بلون ألاكسنت وخط أكبر
// لأنه المحور) ← الفيديو اللي بعده مباشرة. كل مقياس (المشاهدات كرقم
// رئيسي بارز، ثم الإعجابات/التعليقات/المشاركات كمقاييس ثانوية) يعرض
// القيم الفعلية الثلاث بدل قيمتين بس.
function buildThreePointHTML(prevVideo, refVideo, nextVideo, refTitle) {
  function tpRowHTML(key, extraClass) {
    const values = [prevVideo, refVideo, nextVideo].map((v, i) => {
      if (!v) return `<span class="tp-value tp-missing">—</span>`;
      return `<span class="tp-value ${i === 1 ? 'tp-ref' : ''}">${fmt(v[key] || 0)}</span>`;
    });
    return `<div class="tp-row ${extraClass || ''}">${values.join('<span class="tp-arrow">←</span>')}</div>`;
  }

  const secondaryMetrics = [
    { key: 'like_count', label: 'عدد الإعجابات' },
    { key: 'comment_count', label: 'عدد التعليقات' },
    { key: 'share_count', label: 'عدد المشاركات' },
  ];
  const cells = secondaryMetrics.map((m) => `
    <div class="compare-cell">
      <div class="metric-name">${m.label}</div>
      ${tpRowHTML(m.key)}
    </div>`).join('');

  const missingNote = !prevVideo
    ? ' ما فيه فيديو منشور قبل الفيديو المرجعي (هو الأقدم بالحساب).'
    : !nextVideo
      ? ' ما فيه فيديو منشور بعد الفيديو المرجعي (هو الأحدث بالحساب).'
      : '';

  return `
    <div class="total-views-hero">
      <div class="hero-label">📊 إجمالي المشاهدات (المقياس الرئيسي)</div>
      ${tpRowHTML('view_count', 'hero-values')}
      <div class="tp-caption-row">
        <span>${prevVideo ? 'قبل' : '—'}</span>
        <span class="tp-ref-caption">🎯 الفيديو المرجعي</span>
        <span>${nextVideo ? 'بعد' : '—'}</span>
      </div>
    </div>
    <div class="compare-grid">${cells}</div>
    <p class="compare-note">مقارنة الفيديو المرجعي «${escapeHtml(refTitle)}» مع الفيديو المنشور مباشرة قبله والفيديو المنشور مباشرة بعده.${missingNote}</p>
  `;
}

/* ========== SHARED COMPARISON RENDERING (total views + secondary metrics) ========== */

function buildComparisonHTML(before, after, opts) {
  opts = opts || {};
  // 'avg' = متوسط عدة فيديوهات (تاريخ يدوي) | 'total' = إجمالي عدة فيديوهات (مقارنة باليوم)
  const secondaryMode = opts.secondaryMode === 'total' ? 'total' : 'avg';
  if (before.length === 0 || after.length === 0) {
    return `<p class="compare-note">${opts.emptyNote || `نحتاج فيديوهات في الفترتين عشان نقدر نقارن (حاليًا: ${before.length} قبل، ${after.length} بعد).`}</p>`;
  }

  const totalViewsBefore = sum(before, 'view_count');
  const totalViewsAfter = sum(after, 'view_count');
  const viewsChange = pctChange(totalViewsBefore, totalViewsAfter);
  const viewsCls = viewsChange > 0.5 ? 'change-up' : viewsChange < -0.5 ? 'change-down' : 'change-flat';
  const viewsArrow = viewsChange > 0.5 ? '▲' : viewsChange < -0.5 ? '▼' : '—';
  const viewsChangeText = isFinite(viewsChange) ? `${viewsArrow} ${Math.abs(viewsChange).toFixed(0)}%` : '—';

  const secondaryLabels = {
    total: { like_count: 'إجمالي الإعجابات', comment_count: 'إجمالي التعليقات', share_count: 'إجمالي المشاركات' },
    avg: { like_count: 'متوسط الإعجابات', comment_count: 'متوسط التعليقات', share_count: 'متوسط المشاركات' },
  }[secondaryMode];

  const secondaryMetrics = [
    { key: 'like_count', label: secondaryLabels.like_count },
    { key: 'comment_count', label: secondaryLabels.comment_count },
    { key: 'share_count', label: secondaryLabels.share_count },
  ];

  const cells = secondaryMetrics.map((m) => {
    const valBefore = secondaryMode === 'avg' ? average(before, m.key) : sum(before, m.key);
    const valAfter = secondaryMode === 'avg' ? average(after, m.key) : sum(after, m.key);
    const change = pctChange(valBefore, valAfter);
    const cls = change > 0.5 ? 'change-up' : change < -0.5 ? 'change-down' : 'change-flat';
    const arrow = change > 0.5 ? '▲' : change < -0.5 ? '▼' : '—';
    const changeText = isFinite(change) ? `${arrow} ${Math.abs(change).toFixed(0)}%` : '—';
    return `
      <div class="compare-cell">
        <div class="metric-name">${m.label}</div>
        <div class="metric-values">
          <span>${fmt(valBefore)}</span>
          <span style="color:var(--text-muted); font-weight:400;">←</span>
          <span>${fmt(valAfter)}</span>
        </div>
        <div class="arrow ${cls}" style="margin-top:4px;">${changeText}</div>
      </div>`;
  }).join('');

  return `
    <div class="total-views-hero">
      <div class="hero-label">📊 إجمالي المشاهدات (المقياس الرئيسي)</div>
      <div class="hero-values">
        <span>${fmt(totalViewsBefore)}</span>
        <span style="color:var(--text-muted); font-weight:400; font-size:1.2rem;">←</span>
        <span>${fmt(totalViewsAfter)}</span>
      </div>
      <div class="hero-arrow ${viewsCls}">${viewsChangeText}</div>
    </div>
    <div class="compare-grid">${cells}</div>
    <p class="compare-note">${opts.note || `مقارنة بين ${before.length} فيديو قبل، و ${after.length} فيديو بعد.`}</p>
  `;
}

function average(arr, key) {
  if (!arr.length) return 0;
  return sum(arr, key) / arr.length;
}
function pctChange(before, after) {
  if (before === 0) return after === 0 ? 0 : Infinity;
  return ((after - before) / before) * 100;
}
 
/* ========== CHARTS ========== */

// عنوان مختصر لمحور الرسم البياني: أول 3 كلمات من عنوان الفيديو
// الفعلي (نفس النص اللي يظهر بقائمة الفيديو المرجعي)، مع "..." بالنهاية
// لو اختصرناه، عشان ما يزدحم المحور بعنوان طويل.
function chartAxisLabel(v) {
  const title = (v.title || '').trim();
  if (!title) return 'فيديو بدون عنوان';
  const words = title.split(/\s+/).slice(0, 3).join(' ');
  const short = words.length > 22 ? words.slice(0, 22).trim() : words;
  return short.length < title.length ? `${short}...` : short;
}

function drawCharts(videos) {
  if (viewsChart) viewsChart.destroy();
  if (engagementChart) engagementChart.destroy();

  const colors = loadColors();

  const labels = videos.map((v) => chartAxisLabel(v));
  const fullTitles = videos.map((v) => (v.title || '').trim() || 'فيديو بدون عنوان');
  const views = videos.map((v) => v.view_count || 0);
  const likes = videos.map((v) => v.like_count || 0);
  const totalLikes = sum(videos, 'like_count');
  const totalComments = sum(videos, 'comment_count');
  const totalShares = sum(videos, 'share_count');
 
  Chart.defaults.font.family = "'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif";
  Chart.defaults.color = '#5B5E85';
 
  document.getElementById('viewsLegend').innerHTML = `
    <span class="legend-item"><i style="background:${colors.views}"></i>مشاهدات</span>
    <span class="legend-item"><i style="background:${colors.likes}"></i>إعجابات</span>
  `;
 
  viewsChart = new Chart(document.getElementById('viewsChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'مشاهدات', data: views, backgroundColor: colors.views, borderRadius: 4, maxBarThickness: 34, yAxisID: 'yViews' },
        { label: 'إعجابات', data: likes, backgroundColor: colors.likes, borderRadius: 4, maxBarThickness: 34, yAxisID: 'yLikes' },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        // العنوان بالمحور مختصر لأول 3 كلمات — نعرض العنوان الكامل
        // بالتولتيب عشان ما تضيع معلومة لو فيه اختصار.
        tooltip: { callbacks: { title: (items) => fullTitles[items[0].dataIndex] } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#5B5E85', font: { size: 11 } } },
        yViews: {
          type: 'linear', position: 'right',
          grid: { color: '#EEF1F6' }, border: { display: false },
          ticks: { color: colors.views },
          title: { display: true, text: 'مشاهدات', color: colors.views, font: { size: 11 } },
        },
        yLikes: {
          type: 'linear', position: 'left',
          grid: { display: false }, border: { display: false },
          ticks: { color: colors.likes },
          title: { display: true, text: 'إعجابات', color: colors.likes, font: { size: 11 } },
        },
      },
    },
  });
 
  const engagementLabels = ['إعجابات', 'تعليقات', 'مشاركات'];
  const engagementTotals = [totalLikes, totalComments, totalShares];
  const engagementColors = [colors.views, colors.likes, colors.shares];
  const engagementTotal = engagementTotals.reduce((a, b) => a + b, 0) || 1;
 
  engagementChart = new Chart(document.getElementById('engagementChart'), {
    type: 'doughnut',
    data: { labels: engagementLabels, datasets: [{ data: engagementTotals, backgroundColor: engagementColors, borderWidth: 0 }] },
    options: { responsive: true, cutout: '62%', plugins: { legend: { display: false } } },
  });
 
  const legendEl = document.getElementById('engagementLegend');
  legendEl.innerHTML = '';
  engagementLabels.forEach((label, i) => {
    const pct = ((engagementTotals[i] / engagementTotal) * 100).toFixed(1);
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="background:${engagementColors[i]}"></span><span class="legend-label">${label}</span><span class="legend-pct">${pct}%</span>`;
    legendEl.appendChild(li);
  });
}
 
/* ========== COLOR CUSTOMIZATION PANEL ========== */
 
function initColorPanel() {
  const panel = document.getElementById('colorPanel');
  const overlay = document.getElementById('overlay');
  const colors = loadColors();
 
  document.getElementById('colorViews').value = colors.views;
  document.getElementById('colorLikes').value = colors.likes;
  document.getElementById('colorShares').value = colors.shares;
 
  function openPanel() { panel.classList.add('open'); overlay.classList.add('open'); }
  function closePanel() { panel.classList.remove('open'); overlay.classList.remove('open'); }
 
  document.getElementById('openColorsBtn').addEventListener('click', openPanel);
  overlay.addEventListener('click', closePanel);
 
  document.getElementById('applyColorsBtn').addEventListener('click', () => {
    const newColors = {
      views: document.getElementById('colorViews').value,
      likes: document.getElementById('colorLikes').value,
      shares: document.getElementById('colorShares').value,
    };
    saveColors(newColors);
    if (currentOpenId) render(currentOpenId);
    closePanel();
  });
 
  document.getElementById('resetColorsBtn').addEventListener('click', () => {
    saveColors(DEFAULT_COLORS);
    document.getElementById('colorViews').value = DEFAULT_COLORS.views;
    document.getElementById('colorLikes').value = DEFAULT_COLORS.likes;
    document.getElementById('colorShares').value = DEFAULT_COLORS.shares;
    if (currentOpenId) render(currentOpenId);
  });
}
 
function sum(arr, key) { return arr.reduce((s, a) => s + (a[key] || 0), 0); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(str) { return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
 
init();
</script>
