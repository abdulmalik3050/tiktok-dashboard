<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحليلات إنستقرام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    /* نفس هوية ZANJBIIL المستخدمة بباقي صفحات الداشبورد. */
    --bg-main: #F5F5FB;
    --bg-card: #FFFFFF;
    --accent: #FF5100;
    --accent2: #6877B1;
    --accent3: #AEB6D8;
    --text: #1B1C4A;
    --text-muted: #5B5E85;
    --border: #DFE1F0;
    --card-shadow: 0 1px 3px rgba(27,28,74,0.05), 0 4px 14px rgba(27,28,74,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    direction: rtl;
    min-height: 100vh;
  }
  header {
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(20px);
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-title-group { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-logo { height: 30px; width: auto; display: block; }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .btn { background: var(--accent); color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 10px; font-size: 0.85rem; border: none; cursor: pointer; font-family: inherit; }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .container { padding: 24px; max-width: 1200px; margin: 0 auto; }

  .search-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .search-row input[type="text"] {
    flex: 1; min-width: 220px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
    font-family: inherit; font-size: 0.95rem; background: #fff;
  }
  .search-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: -14px; margin-bottom: 20px; }

  .error-box { background: #FEF2F2; color: #B91C1C; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.88rem; }
  .info-box { background: #FFF7ED; color: #9A5B13; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.6; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

  .channel-card { display: flex; align-items: center; gap: 16px; background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .channel-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--bg-main); }
  .channel-meta h2 { font-size: 1.1rem; margin-bottom: 4px; }
  .channel-meta h2 a { color: inherit; text-decoration: none; }
  .channel-meta h2 a:hover { color: var(--accent); }
  .channel-meta .channel-handle { color: var(--text-muted); font-size: 0.85rem; }

  .kpis { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .kpi { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 18px 24px; flex: 1; min-width: 140px; text-align: center; }
  .kpi-value { display: block; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .kpi-label { font-size: 0.85rem; color: var(--text-muted); }

  .card { background: var(--bg-card); border-radius: 14px; box-shadow: var(--card-shadow); padding: 20px; margin-bottom: 20px; }
  .card h2 { font-size: 1.02rem; margin-bottom: 14px; }

  /* ===== الرسوم البيانية (نفس أسلوب dashboard.html/youtube.html) ===== */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .chart-head h2 { margin-bottom: 0; }
  .chart-head-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .legend-row { display: flex; gap: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-muted); }
  .legend-item i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .chart-type-toggle { display: flex; gap: 2px; background: var(--bg-main); border-radius: 8px; padding: 3px; flex-shrink: 0; }
  .chart-type-btn { background: none; border: none; font-family: inherit; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); line-height: 1; }
  .chart-type-btn.active { background: var(--accent); color: #fff; }
  .chart-type-btn:hover:not(.active) { color: var(--text); }

  .donut-layout { display: flex; align-items: center; gap: 18px; }
  .donut-layout canvas { max-width: 230px; max-height: 230px; flex-shrink: 0; }
  .donut-layout.wide { flex-direction: column; align-items: stretch; }
  .donut-layout.wide canvas { max-width: 100%; max-height: 260px; width: 100%; }
  .donut-layout.wide .donut-legend { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .donut-legend { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .donut-legend li { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .donut-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend .legend-label { color: var(--text); flex: 1; }
  .donut-legend .legend-pct { color: var(--text-muted); font-weight: 600; }

  .post-list { display: flex; flex-direction: column; gap: 12px; }
  .post-row { display: flex; gap: 14px; align-items: center; padding: 10px; border-radius: 12px; background: var(--bg-main); flex-wrap: wrap; }
  .post-thumb { width: 68px; height: 68px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--border); }
  .post-info { flex: 1; min-width: 200px; }
  .post-caption { font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: var(--text); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post-caption:hover { color: var(--accent); }
  .post-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
  .post-stats strong { color: var(--text); font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="header-title-group">
    <img class="brand-logo" src="zanjbiil-logo.png" alt="ZANJBIIL" onerror="this.style.display='none'">
    <h1>📷 تحليلات إنستقرام</h1>
  </div>
  <div class="header-actions">
    <a class="btn btn-ghost" href="/youtube.html">▶️ يوتيوب</a>
    <a class="btn btn-ghost" href="/accounts.html">حسابات TikTok</a>
    <a class="btn btn-ghost" href="/dashboard.html">لوحة التحكم</a>
  </div>
</header>

<div class="container">
  <form class="search-row" id="searchForm">
    <input type="text" id="usernameInput" placeholder="اسم المستخدم (username)، مثل abdulmalik96996" autocomplete="off">
    <button type="submit" class="btn" id="searchBtn">🔍 بحث</button>
  </form>
  <p class="search-hint">أي حساب Business/Creator عام يعرض إحصائياته العامة فقط. حسابك الخاص (abdulmalik96996) يعرض كمان آخر 15 منشور.</p>

  <div id="content">
    <div class="empty-state">
      <div class="empty-icon">📷</div>
      <h2>ابحث عن حساب إنستقرام</h2>
      <p style="margin-top:8px;">اكتب اسم المستخدم أعلاه لعرض المتابعين وعدد المنشورات.</p>
    </div>
  </div>
</div>

<script>
function fmt(n) { return n == null ? '—' : Math.round(n).toLocaleString('en-US'); }
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escapeAttr(str) { return escapeHtml(str); }

async function init() {
  const meRes = await fetch('/.netlify/functions/auth-me', { credentials: 'same-origin' });
  const me = await meRes.json();
  if (!me.authenticated) { window.location.href = '/login.html'; return; }

  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = document.getElementById('usernameInput').value.trim();
    if (!q) return;
    const url = new URL(window.location.href);
    url.searchParams.set('q', q);
    window.history.replaceState({}, '', url);
    runSearch(q);
  });

  const params = new URLSearchParams(window.location.search);
  const initialQuery = params.get('q');
  if (initialQuery) {
    document.getElementById('usernameInput').value = initialQuery;
    runSearch(initialQuery);
  }
}

async function runSearch(q) {
  const contentEl = document.getElementById('content');
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  contentEl.innerHTML = '<div class="loading">جاري البحث…</div>';

  try {
    const res = await fetch(`/.netlify/functions/instagram-lookup?q=${encodeURIComponent(q)}`, { credentials: 'same-origin' });
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    const data = await res.json();

    if (!res.ok) {
      contentEl.innerHTML = `<div class="error-box">⚠️ ${escapeHtml(data.error || 'صار خطأ غير متوقع.')}</div>`;
      return;
    }
    render(data);
  } catch (err) {
    contentEl.innerHTML = '<div class="error-box">⚠️ تعذر الاتصال بالخادم. تحقق من اتصالك وحاول مرة ثانية.</div>';
  } finally {
    btn.disabled = false;
  }
}

function render(data) {
  const account = data.account;
  const posts = data.posts || [];
  const contentEl = document.getElementById('content');

  const profileUrl = `https://www.instagram.com/${encodeURIComponent(account.username)}/`;

  contentEl.innerHTML = `
    <div class="channel-card">
      ${account.profile_picture ? `<img class="channel-avatar" src="${escapeAttr(account.profile_picture)}" alt="">` : ''}
      <div class="channel-meta">
        <h2><a href="${escapeAttr(profileUrl)}" target="_blank" rel="noopener">${escapeHtml(account.name || account.username)}</a></h2>
        <div class="channel-handle">@${escapeHtml(account.username)}</div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><span class="kpi-value">${fmt(account.followers_count)}</span><span class="kpi-label">متابعين</span></div>
      <div class="kpi"><span class="kpi-value">${fmt(account.media_count)}</span><span class="kpi-label">عدد المنشورات</span></div>
    </div>
    ${
      account.is_own
        ? renderOwnAccountSections(posts)
        : `<div class="info-box">ℹ️ إنستقرام ما يسمح لنا بعرض تفاصيل منشورات حساب غير حسابنا — فقط الإحصائيات العامة (المتابعين وعدد المنشورات) ظاهرة أعلاه. آخر المنشورات بالتفصيل متاحة فقط لحسابك المتصل (@abdulmalik96996).</div>`
    }
  `;

  if (account.is_own && posts.length) drawCharts(posts);
}

function renderOwnAccountSections(posts) {
  if (!posts.length) {
    return `<div class="card empty-state"><div class="empty-icon">🖼️</div><p>ما فيه منشورات لعرضها بهذا الحساب.</p></div>`;
  }
  return `
    <div class="charts">
      <div class="card">
        <div class="chart-head">
          <h2>الإعجابات والتعليقات لكل منشور</h2>
          <div class="chart-head-controls">
            <div class="legend-row" id="postsLegend"></div>
            <div class="chart-type-toggle" id="postsChartTypeToggle"></div>
          </div>
        </div>
        <div id="postsChartWrap"><canvas id="postsChart" height="230"></canvas></div>
      </div>
      <div class="card">
        <div class="chart-head">
          <h2>توزيع التفاعل</h2>
          <div class="chart-type-toggle" id="engagementChartTypeToggle"></div>
        </div>
        <div class="donut-layout" id="engagementLayout">
          <canvas id="engagementChart"></canvas>
          <ul class="donut-legend" id="engagementLegend"></ul>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>آخر ${posts.length} منشور</h2>
      <div class="post-list">${posts.map(postRowHTML).join('')}</div>
    </div>
  `;
}

function postRowHTML(p) {
  const caption = (p.caption || '').trim().split('\n')[0] || 'منشور بدون وصف';
  const link = p.permalink || '#';
  return `
    <div class="post-row">
      ${p.thumbnail ? `<img class="post-thumb" src="${escapeAttr(p.thumbnail)}" alt="">` : '<div class="post-thumb"></div>'}
      <div class="post-info">
        <a class="post-caption" href="${escapeAttr(link)}" target="_blank" rel="noopener">${escapeHtml(caption)}</a>
        <div class="post-stats">
          <span>❤️ <strong>${fmt(p.like_count)}</strong> إعجاب</span>
          <span>💬 <strong>${fmt(p.comment_count)}</strong> تعليق</span>
        </div>
      </div>
    </div>`;
}

/* ========== CHARTS (نفس أسلوب dashboard.html/youtube.html) ========== */

const CHART_COLORS = { likes: '#FF5100', comments: '#6877B1' };

function sum(arr, key) { return arr.reduce((s, a) => s + (a[key] || 0), 0); }

let postsChart = null;
let engagementChart = null;
let lastPosts = null;
let postsChartType = 'bar'; // 'bar' | 'line' | 'doughnut'
let engagementChartType = 'doughnut'; // 'bar' | 'line' | 'doughnut'

function renderChartTypeToggle(containerId, currentType, onChange) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const types = [
    { type: 'bar', icon: '📊', title: 'أعمدة' },
    { type: 'line', icon: '📈', title: 'خطي' },
    { type: 'doughnut', icon: '🍩', title: 'دائري' },
  ];
  el.innerHTML = types
    .map((t) => `<button class="chart-type-btn ${t.type === currentType ? 'active' : ''}" data-type="${t.type}" title="${t.title}" aria-label="${t.title}">${t.icon}</button>`)
    .join('');
  el.querySelectorAll('.chart-type-btn').forEach((btn) => {
    btn.addEventListener('click', () => onChange(btn.dataset.type));
  });
}

function handlePostsChartTypeChange(type) {
  postsChartType = type;
  renderPostsChart();
  renderChartTypeToggle('postsChartTypeToggle', postsChartType, handlePostsChartTypeChange);
}
function handleEngagementChartTypeChange(type) {
  engagementChartType = type;
  renderEngagementChart();
  renderChartTypeToggle('engagementChartTypeToggle', engagementChartType, handleEngagementChartTypeChange);
}

function drawCharts(posts) {
  lastPosts = posts;
  Chart.defaults.font.family = "'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif";
  Chart.defaults.color = '#5B5E85';

  renderChartTypeToggle('postsChartTypeToggle', postsChartType, handlePostsChartTypeChange);
  renderChartTypeToggle('engagementChartTypeToggle', engagementChartType, handleEngagementChartTypeChange);

  renderPostsChart();
  renderEngagementChart();
}

// "الإعجابات والتعليقات لكل منشور": أعمدة أو خطي بمحورين، أو دائري
// (يعرض توزيع الإعجابات فقط بين المنشورات). تسميات المحور الأفقي
// أرقام بسيطة فقط (1، 2، 3...) — وصف المنشور الفعلي يظهر بالتولتيب
// فقط عند تمرير الفأرة، بدون تكرار تحت المحور.
function renderPostsChart() {
  if (!lastPosts) return;
  if (postsChart) postsChart.destroy();

  const posts = lastPosts;
  const labels = posts.map((_, i) => String(i + 1));
  const captions = posts.map((p) => (p.caption || '').trim().split('\n')[0] || 'منشور بدون وصف');
  const likes = posts.map((p) => p.like_count || 0);
  const comments = posts.map((p) => p.comment_count || 0);

  document.getElementById('postsLegend').innerHTML =
    postsChartType === 'doughnut'
      ? `<span class="legend-item"><i style="background:${CHART_COLORS.likes}"></i>إعجابات (بدون التعليقات بهذا الوضع)</span>`
      : `<span class="legend-item"><i style="background:${CHART_COLORS.likes}"></i>إعجابات</span>
         <span class="legend-item"><i style="background:${CHART_COLORS.comments}"></i>تعليقات</span>`;

  const wrap = document.getElementById('postsChartWrap');
  wrap.innerHTML = '<canvas id="postsChart" height="230"></canvas>';

  if (postsChartType === 'doughnut') {
    const total = likes.reduce((a, b) => a + b, 0) || 1;
    postsChart = new Chart(document.getElementById('postsChart'), {
      type: 'doughnut',
      data: { labels, datasets: [{ data: likes, backgroundColor: labels.map((_, i) => shadeColor(CHART_COLORS.likes, i)), borderWidth: 0 }] },
      options: {
        responsive: true,
        cutout: '55%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => captions[items[0].dataIndex],
              label: (item) => `إعجابات: ${fmt(item.parsed)} (${((item.parsed / total) * 100).toFixed(1)}%)`,
            },
          },
        },
      },
    });
    return;
  }

  const isLine = postsChartType === 'line';
  postsChart = new Chart(document.getElementById('postsChart'), {
    type: isLine ? 'line' : 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'إعجابات', data: likes, yAxisID: 'yLikes',
          ...(isLine
            ? { borderColor: CHART_COLORS.likes, backgroundColor: CHART_COLORS.likes, tension: 0.3, fill: false, pointRadius: 3 }
            : { backgroundColor: CHART_COLORS.likes, borderRadius: 4, maxBarThickness: 34 }),
        },
        {
          label: 'تعليقات', data: comments, yAxisID: 'yComments',
          ...(isLine
            ? { borderColor: CHART_COLORS.comments, backgroundColor: CHART_COLORS.comments, tension: 0.3, fill: false, pointRadius: 3 }
            : { backgroundColor: CHART_COLORS.comments, borderRadius: 4, maxBarThickness: 34 }),
        },
      ],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { title: (items) => captions[items[0].dataIndex] } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#5B5E85', font: { size: 11 } } },
        yLikes: {
          type: 'linear', position: 'right',
          grid: { color: '#EEF1F6' }, border: { display: false },
          ticks: { color: CHART_COLORS.likes },
          title: { display: true, text: 'إعجابات', color: CHART_COLORS.likes, font: { size: 11 } },
        },
        yComments: {
          type: 'linear', position: 'left',
          grid: { display: false }, border: { display: false },
          ticks: { color: CHART_COLORS.comments },
          title: { display: true, text: 'تعليقات', color: CHART_COLORS.comments, font: { size: 11 } },
        },
      },
    },
  });
}

// "توزيع التفاعل": دائري (افتراضي) أو أعمدة أو خطي، لنسبة الإعجابات
// مقابل التعليقات من إجمالي التفاعل على آخر المنشورات.
function renderEngagementChart() {
  if (!lastPosts) return;
  if (engagementChart) engagementChart.destroy();

  const posts = lastPosts;
  const engagementLabels = ['إعجابات', 'تعليقات'];
  const engagementTotals = [sum(posts, 'like_count'), sum(posts, 'comment_count')];
  const engagementColors = [CHART_COLORS.likes, CHART_COLORS.comments];
  const engagementTotal = engagementTotals.reduce((a, b) => a + b, 0) || 1;

  const layoutEl = document.getElementById('engagementLayout');
  layoutEl.classList.toggle('wide', engagementChartType !== 'doughnut');
  layoutEl.innerHTML = '<canvas id="engagementChart"></canvas><ul class="donut-legend" id="engagementLegend"></ul>';

  if (engagementChartType === 'doughnut') {
    engagementChart = new Chart(document.getElementById('engagementChart'), {
      type: 'doughnut',
      data: { labels: engagementLabels, datasets: [{ data: engagementTotals, backgroundColor: engagementColors, borderWidth: 0 }] },
      options: { responsive: true, cutout: '62%', plugins: { legend: { display: false } } },
    });
  } else {
    const isLine = engagementChartType === 'line';
    engagementChart = new Chart(document.getElementById('engagementChart'), {
      type: isLine ? 'line' : 'bar',
      data: {
        labels: engagementLabels,
        datasets: [
          {
            label: 'الإجمالي', data: engagementTotals,
            ...(isLine
              ? { borderColor: CHART_COLORS.likes, backgroundColor: engagementColors, tension: 0.3, fill: false, pointRadius: 5, pointBackgroundColor: engagementColors }
              : { backgroundColor: engagementColors, borderRadius: 4, maxBarThickness: 46 }),
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#5B5E85', font: { size: 11 } } },
          y: { grid: { color: '#EEF1F6' }, border: { display: false }, ticks: { color: '#5B5E85' } },
        },
      },
    });
  }

  const legendEl = document.getElementById('engagementLegend');
  legendEl.innerHTML = '';
  engagementLabels.forEach((label, i) => {
    const pct = ((engagementTotals[i] / engagementTotal) * 100).toFixed(1);
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot" style="background:${engagementColors[i]}"></span><span class="legend-label">${label}</span><span class="legend-pct">${pct}%</span>`;
    legendEl.appendChild(li);
  });
}

function shadeColor(hex, index) {
  const amount = ((index * 37) % 100) / 100;
  const num = parseInt(hex.replace('#', ''), 16);
  const r = (num >> 16) & 0xff;
  const g = (num >> 8) & 0xff;
  const b = num & 0xff;
  const lighten = (c) => Math.round(c + (255 - c) * amount * 0.65);
  return `rgb(${lighten(r)}, ${lighten(g)}, ${lighten(b)})`;
}
