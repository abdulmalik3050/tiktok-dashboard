[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/tiktok/*"
  to = "/.netlify/functions/:splat"
  status = 200

# /privacy (بدون امتداد) هو الرابط الظاهر بصفحة /login والمُسلَّم بطلب
# مراجعة TikTok for Developers — يوجّه صراحة للنسخة الإنجليزية القديمة
# (privacy-tiktok.html). لا يمس هذا الرابط /privacy.html بامتداده الكامل
# — يبقى يفتح مباشرة على privacy.html (النسخة العربية) كملف ثابت عادي،
# بدون أي قاعدة توجيه له هنا.
[[redirects]]
  from = "/privacy"
  to = "/privacy-tiktok.html"
  status = 200
  force = true
